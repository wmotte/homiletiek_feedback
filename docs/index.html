<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homiletische Analyse - Dekker</title>
    <style>
        :root {
            /* Light Theme Defaults - Warmer Palette */
            --primary-hue: 30;
            --primary-color: hsl(var(--primary-hue), 60%, 40%);
            --accent-color: hsl(var(--primary-hue), 70%, 50%);
            
            --bg-body: #fdf8f4;
            --bg-surface: #ffffff;
            --bg-element: #fcf3eb;
            
            --text-main: #3d3028;
            --text-muted: #7a6a5e;
            --text-inverse: #ffffff;
            
            --border-color: #eaddd5;
            --shadow: 0 4px 6px -1px rgba(61, 48, 40, 0.1), 0 2px 4px -1px rgba(61, 48, 40, 0.06);
            
            --success-color: #558b2f;
            --warning-color: #ffa000;
            --danger-color: #b71c1c;
            
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Consolas', monospace;
            --font-serif: 'Georgia', serif;
        }

        [data-theme="dark"] {
            /* Dark Theme Overrides - Warmer Palette */
            --primary-color: hsl(var(--primary-hue), 50%, 60%);
            --accent-color: hsl(var(--primary-hue), 60%, 70%);
            
            --bg-body: #1f1b18;
            --bg-surface: #2b2621;
            --bg-element: #38302a;
            
            --text-main: #f4ede6;
            --text-muted: #b0a49a;
            --text-inverse: #1f1b18;
            
            --border-color: #4a4038;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            
            --success-color: #8bc34a;
            --warning-color: #ffca28;
            --danger-color: #ff7043;
        }

        * { box-sizing: border-box; transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; }

        body {
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-body);
            color: var(--text-main);
        }

        header {
            background-color: var(--bg-surface);
            padding: 0 2rem;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .header-left { display: flex; align-items: center; gap: 1.5rem; }
        
        h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: var(--text-inverse);
            font-size: 0.7rem;
            font-weight: 700;
            text-decoration: none;
            font-style: normal;
            transition: all 0.2s;
        }

        .info-link:hover {
            background-color: var(--accent-color);
            transform: scale(1.1);
        }

        .example-selector {
            background: var(--bg-element);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .example-selector:focus { border-color: var(--primary-color); }

        .tab-nav {
            display: flex;
            gap: 2rem;
            height: 70px;
        }

        .tab-btn {
            background: none;
            border: none;
            height: 100%;
            padding: 0 0.5rem;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn:hover { color: var(--primary-color); }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .controls {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .file-input-group {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-element);
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover { background: var(--border-color); }

        input[type="file"] {
            position: absolute;
            font-size: 100px;
            opacity: 0;
            right: 0;
            top: 0;
            cursor: pointer;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
            padding: 0.5rem;
            border-radius: 50%;
        }
        .theme-toggle:hover { background-color: var(--bg-element); color: var(--text-main); }

        main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .tab-content {
            display: none;
            height: 100%;
            overflow-y: scroll;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 1200px) {
            .full-width {
                grid-column: 1;
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .score-badge {
            font-family: var(--font-mono);
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #fff;
        }

        .score-high { background-color: var(--success-color); }
        .score-mid { background-color: var(--warning-color); }
        .score-low { background-color: var(--danger-color); }

        .text-content {
            line-height: 1.6;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .text-content p {
            margin: 0.75rem 0;
        }

        .text-content p:first-child {
            margin-top: 0;
        }

        .text-content p:last-child {
            margin-bottom: 0;
        }

        .quote-box {
            background-color: var(--bg-element);
            border-left: 3px solid var(--accent-color);
            padding: 0.75rem 1rem;
            margin: 1rem 0 0 0;
            border-radius: 0 6px 6px 0;
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .quote-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            display: block;
            font-style: normal;
        }

        .advice-box {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
            color: var(--danger-color);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .summary-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .summary-col { flex: 1; }
        .summary-col h3 { font-size: 0.95rem; margin-bottom: 0.75rem; font-weight: 700;}
        .summary-list { margin: 0; padding-left: 1.2rem; }
        .summary-list li { margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; }

        #sermon-view {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-surface);
            padding: 3rem;
            border-radius: 4px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .sermon-text {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-wrap;
        }

        .stat-item {
            background: var(--bg-element);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-val { display: block; font-size: 1.1rem; font-weight: 700; color: var(--primary-color); margin-bottom: 0.25rem; }
        .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        #tab-sermon::-webkit-scrollbar { width: 25px; }
        #tab-sermon::-webkit-scrollbar-track { background: var(--bg-body); border-left: 1px solid var(--border-color); }
        #tab-sermon::-webkit-scrollbar-thumb { 
            background: var(--primary-color); 
            border-radius: 12px; 
            border: 5px solid var(--bg-body); 
        }
        #tab-sermon::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        .info-block {
            background: var(--bg-element);
            border-left: 4px solid var(--primary-color);
            padding: 1rem 1.5rem;
            margin: 0 auto 2rem auto;
            border-radius: 0 8px 8px 0;
            max-width: calc(1200px - 4rem);
            width: calc(100% - 4rem);
        }

        .info-block-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-block-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin: 0;
        }

        .section-info {
            background: var(--bg-element);
            border-left: 3px solid var(--accent-color);
            padding: 0.5rem 0.75rem;
            margin: 1.5rem 2rem 0.75rem 2rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.78rem;
            line-height: 1.4;
            color: var(--text-muted);
            font-style: italic;
            grid-column: 1 / -1;
        }

    </style>
</head>
<body>

<header>
    <div class="header-left">
        <h1>
            <span>Preekanalyse <span style="font-weight:400; color:var(--text-muted); font-size: 0.9em;">// Feedback</span></span>
            <a href="https://github.com/wmotte/homiletiek_feedback"
               target="_blank"
               class="info-link"
               title="Meer informatie">i</a>
        </h1>
        
        <select class="example-selector" id="example-select">
            <option value="voorbeeld_Barmhartige_Samaritaan">Preek Barmhartige Samaritaan - Lucas 10:25–37</option>
            <option value="voorbeeld_Edward_Schillebeeckx">Preek Edward Schillebeeckx - datum onbekend</option>
            <option value="voorbeeld_Dorothee_Sölle">Preek Dorothee Sölle - 8 januari 1968</option>

        </select>

        <select class="example-selector" id="analysis-type-select">
            <option value="kolb">Kolb analyse</option>

            <option value="aristoteles">Aristoteles analyse</option>
            <option value="schulz">Schulz von Thun analyse</option>
            <option value="transactional">Transactionele Analyse</option>
            <option value="esthetiek">Esthetiek analyse</option>
            <option value="metafoor">Metafoor (CMT) analyse</option>
            <option value="narratief">Narratief (Greimas) analyse</option>
            <option value="taalhandeling">Taalhandeling (SAT) analyse</option>

        <nav class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('analysis')">Analyse dashboard</button>

    <div class="controls">

</header>

<main>
    <div id="tab-analysis" class="tab-content active">
        <div id="analysis-info-block" class="info-block">
            <div class="info-block-title">
                Over deze analyse
                <a href="#" id="info-block-link" target="_blank" class="info-link" title="Lees meer">i</a>
            </div>
            <p class="info-block-text" id="info-block-text">Laden...</p>
        </div>
        <div class="dashboard-grid" id="dashboard-content">
            <div class="card full-width"><em>Laden...</em></div>
        </div>
    </div>

    <div id="tab-sermon" class="tab-content">
        <div id="sermon-view">
            <div id="sermon-content" class="sermon-text">
                <em>Geen preektekst geladen.</em>
            </div>
        </div>
    </div>
</main>

<script>
    let currentTheme = 'dark';

    // Store combined analysis data when a combined JSON is uploaded
    let combinedAnalysisData = null;

    // Analysis type mapping for display names and detection
    const ANALYSIS_TYPE_CONFIG = {
        'dekker': { name: 'Dekker analyse', detectKey: 'analyse_per_criterium' },
        'kolb': { name: 'Kolb analyse', detectKey: 'kolb_fasen_analyse' },
        'aristoteles': { name: 'Aristoteles analyse', detectKey: 'aristotelische_modi_analyse' },
        'schulz_von_thun': { name: 'Schulz von Thun analyse', detectKey: 'schulz_von_thun_analyse' },
        'transactional': { name: 'Transactionele Analyse', detectKey: 'ta_analyse' },
        'esthetiek': { name: 'Esthetiek analyse', detectKey: 'esthetische_analyse' },
        'metafoor': { name: 'Metafoor (CMT) analyse', detectKey: 'primaire_analyse' },
        'narratief': { name: 'Narratief (Greimas) analyse', detectKey: 'semiotische_analyse' },
        'taalhandeling': { name: 'Taalhandeling (SAT) analyse', detectKey: 'taalhandeling_analyse' }
    };

    /**
     * Converts straight quotes to curly quotes with proper Dutch language support.
     * Handles cases like 's ochtends, 's avonds, etc.
     */
    function toCurlyQuotes(text) {
        if (!text) return text;

        // Step 1: Handle double quotes
        // Opening: after whitespace or punctuation
        text = text.replace(/(^|[\s\(\[\{—–])"(?=\S)/gm, '$1\u201c');
        // Closing: after text
        text = text.replace(/(\S)"(?=[\s\)\]\}\.,;:!?—–]|$)/gm, '$1\u201d');
        // Fallback for double quotes
        text = text.replace(/"/g, '\u201d');

        // Step 2: Handle Dutch specific apostrophes at start of words ('s, 't, 'n)
        text = text.replace(/(^|\s)'(s|t|n)\b/gi, '$1\u2019$2');

        // Step 3: Handle apostrophes inside words (Risico's, it's, baby's)
        text = text.replace(/([a-zA-Z])'([a-zA-Z])/g, '$1\u2019$2');

        // Step 4: Handle opening single quotes
        text = text.replace(/(^|[\s\(\[\{—–])'(?=\S)/gm, '$1\u2018');

        // Step 5: Handle all remaining single quotes as closing/apostrophe
        text = text.replace(/'/g, '\u2019');

        return text;
    }

    /**
     * Replaces English learning style terminology with Dutch equivalents
     */
    function toNederlandseTerminologie(text) {
        if (!text) return text;
        
        // Only apply Kolb-specific terminology replacements if we are in Kolb analysis
        const analysisTypeSelector = document.getElementById('analysis-type-select');
        if (analysisTypeSelector && analysisTypeSelector.value !== 'kolb') {
            return text;
        }

        // Replace English learning style terms with Dutch equivalents
        // Case-insensitive replacements
        text = text.replace(/\bassimilator(en)?\b/gi, (match) => {
            return match.toLowerCase() === 'assimilatoren' ? 'denkers' : 'denker';
        });
        text = text.replace(/\bconverger(s)?\b/gi, (match) => {
            return match.toLowerCase() === 'convergers' ? 'beslissers' : 'beslisser';
        });
        text = text.replace(/\baccommodator(en|s)?\b/gi, (match) => {
            return match.toLowerCase() === 'accommodatoren' || match.toLowerCase() === 'accommodators' ? 'doeners' : 'doener';
        });
        text = text.replace(/\bdiverger(s)?\b/gi, (match) => {
            return match.toLowerCase() === 'divergers' ? 'dromers' : 'dromer';
        });

        return text;
    }

    /**
     * Formats text with Dutch terminology, curly quotes, and Markdown parsing
     */
    function formatText(text) {
        if (!text) return text;
        
        let formatted = toCurlyQuotes(toNederlandseTerminologie(text));
        
        // Parse Markdown Bold (**text**)
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        
        // Parse Markdown Italic (*text*) - ensure we don't break list items
        formatted = formatted.replace(/(^|[^\*])\*([^\*]+)\*/g, '$1<em>$2</em>');
        
        return formatted;
    }

    const analysisInfo = {
        'kolb': {
            text: 'Binnen de homiletiek wordt de prediking gezien als een cyclisch proces waarin de hoorder wordt uitgenodigd om door verschillende stadia van perceptie en verwerking te bewegen. Gebaseerd op Kolbs theorie analyseert dit model de transformatie van ervaring in geloofskennis via vier fasen:\n\n• CE (Concrete Ervaring) – voelen en ervaren (Dromer, Doener)\n• RO (Reflectieve Observatie) – kijken en luisteren (Dromer, Denker)\n• AC (Abstracte Conceptualisering) – denken en logica (Denker, Beslisser)\n• AE (Actief Experimenteren) – doen en toepassen (Beslisser, Doener)\n\nEen integrale preek doorloopt deze hele cyclus om elke hoorder aan te spreken en tot spirituele groei te leiden.',
            link: 'https://github.com/wmotte/homiletiek_feedback/blob/main/misc/kolbs_leercyclus.md'
        },
        'dekker': {
            text: 'De thesen van Willem Maarten Dekker definiëren een preek als "uitleg en toepassing van een specifiek Bijbelgedeelte". De analyse beoordeelt de preek volgens de 3-2-1-regel: de drie stukken (ellende, verlossing, dankbaarheid) als existentiële lagen, de twee wegen (ten verderve en ten leven) die de mens als verantwoordelijk wezen aanspreken, en de ene Heer (Christus) als het telos van de preek. Daarnaast wordt getoetst op de onlosmakelijke verbinding tussen exegese en concrete toepassing.',
            link: 'https://github.com/wmotte/homiletiek_feedback/blob/main/misc/wat_is_een_preek_dekker.md'
        },
        'aristoteles': {
            text: 'De klassieke retorica van Aristoteles biedt drie fundamentele modi van overtuiging die de Rhetorical Triangle vormen. Deze analyse diagnosticeert welk element uit balans is:\n\n• Logos (Rationele Architectuur) – De logische structuur en interne consistentie van het betoog\n• Pathos (Emotionele Resonantie) – Het vermogen om de hoorder te raken in emoties en verlangens\n• Ethos (Geloofwaardigheid) – De authenticiteit en integriteit van de boodschapper\n\nDe drie modi corresponderen met de grote "orthos": Logos → Orthodoxie, Pathos → Orthopathie, Ethos → Orthopraxie. Een effectieve preek bereikt de hoorder via hoofd, hart én handen.',
            link: 'https://github.com/wmotte/homiletiek_feedback/blob/main/misc/aristotelische_modi.md'
        },
        'schulz': {
            text: 'Het communicatiemodel van Schulz von Thun analyseert de vier boodschappen die in elke preek tegelijkertijd klinken:\n\n• Zakelijke Inhoud (Blauw) – Feiten, exegese en theologische waarheid\n• Zelf-onthulling (Groen) – De authenticiteit en persoonlijkheid van de prediker\n• Relatie (Geel) – Hoe de prediker de gemeente ziet en aanspreekt\n• Appel (Rood) – De oproep tot actie of geloof (Wet vs. Evangelie)\n\nDeze analyse toetst ook de congruentie (kloppen toon en inhoud?) en de balans, om te voorkomen dat de preek eenzijdig intellectualistisch (blauw), narcistisch (groen), betuttelend (geel) of moralistisch (rood) wordt.',
            link: 'https://github.com/wmotte/homiletiek_feedback/blob/main/misc/schulz_von_thun.md'
        },
        'transactional': {
            text: 'De Transactionele Analyse (TA) onderzoekt de psychologische dynamiek en ego-posities in de preek:\n\n• Ego-posities: Spreekt de prediker als Ouder (Kritisch/Voedend), Volwassene, of Kind? En welke positie wordt bij de hoorder opgeroepen?\n• Transacties: Zijn de interacties complementair, gekruist of ulterieur (verborgen boodschappen)?\n• Spelen (Games): Worden er manipulatieve psychologische spelen gespeeld (bijv. "Redemption", "Ain\'t it Awful")?\n• Dramadriehoek: Worden rollen van Redder, Slachtoffer en Aanklager ingenomen?\n\nEen gezonde preek bevordert autonomie (Volwassene-Volwassene) en vermijdt manipulatie.',
            link: '#'
        },
        'esthetiek': {

    function updateInfoBlock(analysisType) {
        const info = analysisInfo[analysisType];
        if (!info) {
            console.error(`No info found for analysis type: ${analysisType}`);
            return;
        }
        // Convert newlines to <br> tags for HTML rendering
        const formattedText = info.text.replace(/\n/g, '<br>');
        document.getElementById('info-block-text').innerHTML = formattedText;
        document.getElementById('info-block-link').href = info.link;
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadTheme();
        const exampleSelector = document.getElementById('example-select');
        const analysisTypeSelector = document.getElementById('analysis-type-select');
        updateInfoBlock(analysisTypeSelector.value);
        loadExample(exampleSelector.value, analysisTypeSelector.value);

        exampleSelector.addEventListener('change', (e) => {
            // Reset combined mode when selecting an example
            combinedAnalysisData = null;
            exampleSelector.style.display = '';
            // Restore full dropdown options
            restoreFullAnalysisDropdown();
            loadExample(e.target.value, analysisTypeSelector.value);
        });
        analysisTypeSelector.addEventListener('change', (e) => {
            updateInfoBlock(e.target.value);
            switchTab('analysis');
            // Check if we're in combined mode
            if (combinedAnalysisData) {
                handleCombinedAnalysisTypeChange(e.target.value);
            } else {
                loadExample(exampleSelector.value, e.target.value);
            }
        });
        document.getElementById('json-upload').addEventListener('change', handleJsonUpload);
    });

    async function loadExample(baseName, analysisType) {
        try {
            // First fetch the base JSON to check for a combined analysis file
            const baseJsonRes = await fetch(`${baseName}.json`);
            let baseJsonData = null;
            if (baseJsonRes.ok) {
                let parsed = await baseJsonRes.json();
                if (Array.isArray(parsed) && parsed.length > 0) parsed = parsed[0];
                if (parsed.metadata && parsed.metadata.type === 'combined_analysis' && parsed.source && parsed.analyses) {
                    handleCombinedAnalysis(parsed);
                    // Keep example selector visible (handleCombinedAnalysis hides it for uploads)
                    const exampleSelector = document.getElementById('example-select');
                    if (exampleSelector) exampleSelector.style.display = '';
                    return;
                }
                baseJsonData = parsed;
            }

            const textRes = await fetch(`${baseName}.txt`);
            if(!textRes.ok) throw new Error(`Kon ${baseName}.txt niet laden`);
            const text = await textRes.text();
            renderSermon(text);

            let jsonSuffix = '';
            if (analysisType === 'kolb') jsonSuffix = '_kolb';
            else if (analysisType === 'aristoteles') jsonSuffix = '_aristoteles';
            else if (analysisType === 'schulz') jsonSuffix = '_schulz_von_thun';
            else if (analysisType === 'transactional') jsonSuffix = '_transactional';
            else if (analysisType === 'esthetiek') jsonSuffix = '_esthetiek';
            else if (analysisType === 'metafoor') jsonSuffix = '_metafoor';
            else if (analysisType === 'narratief') jsonSuffix = '_narratief';
            else if (analysisType === 'taalhandeling') jsonSuffix = '_taalhandeling';

            // Reuse cached base JSON for dekker (no suffix), otherwise fetch the specific file
            let data;
            if (jsonSuffix === '' && baseJsonData) {
                data = baseJsonData;
            } else {
                const jsonRes = await fetch(`${baseName}${jsonSuffix}.json`);
                if(!jsonRes.ok) throw new Error(`Kon ${baseName}${jsonSuffix}.json niet laden`);
                data = await jsonRes.json();
            }

            if (analysisType === 'kolb') {
                renderAnalysisKolb(data);
            } else if (analysisType === 'aristoteles') {
                renderAnalysisAristoteles(data);
            } else if (analysisType === 'schulz') {
                renderAnalysisSchulzVonThun(data);
            } else if (analysisType === 'transactional') {
                renderAnalysisTransactional(data);
            } else if (analysisType === 'esthetiek') {
                renderAnalysisEsthetiek(data);
            } else if (analysisType === 'metafoor') {
                renderAnalysisMetafoor(data);
            } else if (analysisType === 'narratief') {
                renderAnalysisNarratief(data);
            } else if (analysisType === 'taalhandeling') {
                renderAnalysisTaalhandeling(data);
            } else {
                renderAnalysisDekker(data);
            }
        } catch (err) {
            console.error("Fout bij laden voorbeeld:", err);
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        const btns = document.querySelectorAll('.tab-btn');
        if(tabId === 'analysis') btns[0].classList.add('active');
        if(tabId === 'sermon') btns[1].classList.add('active');
    }

    function toggleTheme() {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }

    function loadTheme() {
        const saved = localStorage.getItem('theme');
        if(saved) document.documentElement.setAttribute('data-theme', saved);
    }

    function handleSermonUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            renderSermon(e.target.result);
            switchTab('sermon');
        };
        reader.readAsText(file);
    }

    function handleJsonUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const json = JSON.parse(e.target.result);
                renderAnalysis(json);
                switchTab('analysis');
            } catch (error) {
                console.error("JSON parse error:", error);
                alert("Ongeldig JSON bestand!");
            }
        };
        reader.readAsText(file);
    }

    /**
     * Main render function that handles both combined and single analysis JSON files.
     * Combined JSON has: { source: "...", analyses: { dekker: {...}, aristoteles: {...}, ... } }
     * Single JSON has the analysis data directly at the root level.
     */
    function renderAnalysis(json) {
        // Unwrap array-wrapped JSON (e.g. [{...}])
        if (Array.isArray(json) && json.length > 0) {
            json = json[0];
        }

        // Check if this is a combined analysis JSON
        if (json.metadata && json.metadata.type === 'combined_analysis' && json.source && json.analyses) {
            handleCombinedAnalysis(json);
            return;
        }

        // Single analysis JSON - detect type and render
        const analysisType = detectAnalysisType(json);
        if (analysisType) {
            renderAnalysisByType(analysisType, json);
        } else {
            // Fallback to Dekker if detection fails
            console.warn("Could not detect analysis type, defaulting to Dekker");
            renderAnalysisDekker(json);
        }
    }

    /**
     * Detect the analysis type from the JSON structure.
     */
    function detectAnalysisType(json) {
        // Check for unique keys that identify each analysis type
        if (json.analyse_per_criterium) return 'dekker';
        if (json.kolb_fasen_analyse) return 'kolb';
        if (json.aristotelische_modi_analyse) return 'aristoteles';
        if (json.schulz_von_thun_analyse) return 'schulz_von_thun';
        if (json.ta_analyse || json.ego_posities_scan || json.transactie_analyse) return 'transactional';
        if (json.esthetische_analyse || json.totaalbeeld_esthetiek) return 'esthetiek';
        if (json.primaire_analyse && json.primaire_analyse.dominante_domeinen) return 'metafoor';
        if (json.semiotische_analyse || json.actantiele_analyse) return 'narratief';
        if (json.taalhandeling_analyse || json.werkwoord_analyse) return 'taalhandeling';
        return null;
    }

    /**
     * Render an analysis by its type identifier.
     */
    function renderAnalysisByType(type, data) {
        // Update info block for the analysis type
        const infoType = type === 'schulz_von_thun' ? 'schulz' : type;
        updateInfoBlock(infoType);

        switch(type) {
            case 'dekker':
                renderAnalysisDekker(data);
                break;
            case 'kolb':
                renderAnalysisKolb(data);
                break;
            case 'aristoteles':
                renderAnalysisAristoteles(data);
                break;
            case 'schulz_von_thun':
                renderAnalysisSchulzVonThun(data);
                break;
            case 'transactional':
                renderAnalysisTransactional(data);
                break;
            case 'esthetiek':
                renderAnalysisEsthetiek(data);
                break;
            case 'metafoor':
                renderAnalysisMetafoor(data);
                break;
            case 'narratief':
                renderAnalysisNarratief(data);
                break;
            case 'taalhandeling':
                renderAnalysisTaalhandeling(data);
                break;
            default:
                console.warn(`Unknown analysis type: ${type}`);
                renderAnalysisDekker(data);
        }
    }

    /**
     * Handle a combined analysis JSON file.
     * This updates the dropdown to show only available analyses and renders the source text.
     */
    function handleCombinedAnalysis(json) {
        // Store the combined data
        combinedAnalysisData = json;

        // Display the source text in the preek tab
        if (json.source) {
            renderSermon(json.source);
        }

        // Show warnings if any
        if (json.warnings && json.warnings.length > 0) {
            console.warn("Analyse waarschuwingen:", json.warnings);
            // Show a notification about warnings
            const warningCount = json.warnings.length;
            setTimeout(() => {
                alert(`Let op: ${warningCount} analyse(s) zijn niet succesvol uitgevoerd.\n\nDetails:\n${json.warnings.join('\n')}`);
            }, 100);
        }

        // Update the analysis type dropdown to show only available analyses
        updateAnalysisDropdownForCombined(json.available_analyses || Object.keys(json.analyses));

        // Hide the example selector since we're using uploaded data
        const exampleSelector = document.getElementById('example-select');
        if (exampleSelector) {
            exampleSelector.style.display = 'none';
        }

        // Render the first available analysis
        const availableTypes = json.available_analyses || Object.keys(json.analyses);
        if (availableTypes.length > 0) {
            const firstType = availableTypes[0];
            const analysisTypeSelector = document.getElementById('analysis-type-select');
            if (analysisTypeSelector) {
                analysisTypeSelector.value = firstType === 'schulz_von_thun' ? 'schulz' : firstType;
            }
            renderAnalysisByType(firstType, json.analyses[firstType]);
        }
    }

    /**
     * Update the analysis type dropdown to show only the available analyses from combined JSON.
     */
    function updateAnalysisDropdownForCombined(availableTypes) {
        const selector = document.getElementById('analysis-type-select');
        if (!selector) return;

        // Map internal keys to dropdown values
        const keyToDropdownValue = {
            'dekker': 'dekker',
            'kolb': 'kolb',
            'aristoteles': 'aristoteles',
            'schulz_von_thun': 'schulz',
            'transactional': 'transactional',
            'esthetiek': 'esthetiek',
            'metafoor': 'metafoor',
            'narratief': 'narratief',
            'taalhandeling': 'taalhandeling'
        };

        const displayNames = {
            'dekker': 'Dekker analyse',
            'kolb': 'Kolb analyse',
            'aristoteles': 'Aristoteles analyse',
            'schulz': 'Schulz von Thun analyse',
            'transactional': 'Transactionele Analyse',
            'esthetiek': 'Esthetiek analyse',
            'metafoor': 'Metafoor (CMT) analyse',
            'narratief': 'Narratief (Greimas) analyse',
            'taalhandeling': 'Taalhandeling (SAT) analyse'
        };

        // Clear existing options
        selector.innerHTML = '';

        // Add options for available analyses
        availableTypes.forEach(type => {
            const dropdownValue = keyToDropdownValue[type] || type;
            const option = document.createElement('option');
            option.value = dropdownValue;
            option.textContent = displayNames[dropdownValue] || type;
            selector.appendChild(option);
        });
    }

    /**
     * Restore the analysis type dropdown to show all analysis types.
     */
    function restoreFullAnalysisDropdown() {
        const selector = document.getElementById('analysis-type-select');
        if (!selector) return;

        const allOptions = [
            { value: 'kolb', text: 'Kolb analyse' },
            { value: 'dekker', text: 'Dekker analyse' },
            { value: 'aristoteles', text: 'Aristoteles analyse' },
            { value: 'schulz', text: 'Schulz von Thun analyse' },
            { value: 'transactional', text: 'Transactionele Analyse' },
            { value: 'esthetiek', text: 'Esthetiek analyse' },
            { value: 'metafoor', text: 'Metafoor (CMT) analyse' },
            { value: 'narratief', text: 'Narratief (Greimas) analyse' },
            { value: 'taalhandeling', text: 'Taalhandeling (SAT) analyse' }
        ];

        selector.innerHTML = '';
        allOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.value;
            option.textContent = opt.text;
            selector.appendChild(option);
        });
    }

    /**
     * Handle analysis type change when using combined data.
     */
    function handleCombinedAnalysisTypeChange(dropdownValue) {
        if (!combinedAnalysisData) return false;

        // Map dropdown values to internal keys
        const dropdownToKey = {
            'dekker': 'dekker',
            'kolb': 'kolb',
            'aristoteles': 'aristoteles',
            'schulz': 'schulz_von_thun',
            'transactional': 'transactional',
            'esthetiek': 'esthetiek',
            'metafoor': 'metafoor',
            'narratief': 'narratief',
            'taalhandeling': 'taalhandeling'
        };

        const internalKey = dropdownToKey[dropdownValue] || dropdownValue;

        if (combinedAnalysisData.analyses && combinedAnalysisData.analyses[internalKey]) {
            renderAnalysisByType(internalKey, combinedAnalysisData.analyses[internalKey]);
            return true;
        }

        return false;
    }

                    </div>
                    <div style="background: var(--bg-element); padding: 0.5rem; border-radius: 4px;">
                        <div style="font-size: 1.2rem;">🫵</div>
                        <div style="font-size: 0.75rem; font-weight: bold;">Aanklager</div>
                    </div>
                </div>
                <p><strong>Rollen Prediker:</strong></p>
                <ul class="summary-list">
                    <li><strong>Redder:</strong> ${formatText(drama.rollen_van_prediker.redder)}</li>
                    <li><strong>Aanklager:</strong> ${formatText(drama.rollen_van_prediker.aanklager)}</li>
                    <li><strong>Slachtoffer:</strong> ${formatText(drama.rollen_van_prediker.slachtoffer)}</li>
                </ul>
                <p style="margin-top: 1rem;"><strong>Positie Gemeente:</strong> ${formatText(drama.positie_van_gemeente)}</p>

        let gamesContent = '';
        if (hasGames) {
            gamesContent = games.gedetecteerde_spelen.map(game => `
                <div style="background: var(--bg-element); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border-left: 3px solid var(--danger-color);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <strong style="color: var(--danger-color); font-size: 1rem;">🎮 ${formatText(game.naam)}</strong>
                        <span style="font-size: 0.8rem; font-weight: bold;">Waarschijnlijkheid: ${formatText(game.waarschijnlijkheid)}</span>
                    </div>
                    <div style="font-size: 0.9rem;">
                        <p><strong>Con (Lokaas):</strong> ${formatText(game.formule_g_analyse.con)}</p>

                    ${game.bewijs_quotes && game.bewijs_quotes.length > 0 ? `

        } else {
             gamesContent = `

                    <strong style="color: var(--success-color);">✅ Geen destructieve spelen gedetecteerd</strong>
                    <p style="margin-top: 0.5rem; font-size: 0.9rem;">${formatText(games.afwezigheid_van_spelen_analyse)}</p>
                </div>
             `;

        gamesCard.innerHTML = `
            <div class="card-header">
                <span class="card-title">Psychologische Spelen (Games)</span>
            </div>
            <div class="text-content">
                ${gamesContent}
            </div>
        `;
        container.appendChild(gamesCard);
    }

    function renderAnalysisMetafoor(data) {
        const container = document.getElementById('dashboard-content');
        container.innerHTML = '';

        // Overall Card
        const overallCard = document.createElement('div');
        overallCard.className = 'card full-width';
        const overall = data.aanbevelingen?.overall_beoordeling || 'Onbekend';
        const coherentie = data.diagnostische_evaluatie?.coherentie_analyse?.overall_coherentie || 'Onbekend';

        overallCard.innerHTML = `
            <div class="card-header">
                <span class="card-title">🧠 Conceptuele Metafoortheorie (CMT)</span>
                <span class="score-badge ${overall === 'EXCELLENT' ? 'score-high' : overall.includes('GOED') ? 'score-mid' : 'score-low'}">${translateTag(overall)}</span>
            </div>
            <div class="text-content">
                <p><strong>Preek:</strong> ${data.metadata?.titel_preek || 'Onbekend'}</p>
                <p><strong>Bijbeltekst:</strong> ${data.metadata?.bijbeltekst || 'Onbekend'}</p>
                <p><strong>Coherentie:</strong> ${translateTag(coherentie)}</p>
                <p>${formatText(data.diagnostische_evaluatie?.coherentie_analyse?.coherentie_verklaring || '')}</p>
            </div>
        `;
        container.appendChild(overallCard);

        // Dominante Domeinen
        const domeinenCard = document.createElement('div');
        domeinenCard.className = 'card';
        const domeinen = data.primaire_analyse?.dominante_domeinen || [];

        let domeinenHTML = '';
        domeinen.forEach(domein => {
            const score = parseInt(domein.prominentie_score) || 0;
            const scoreClass = score >= 8 ? 'score-high' : score >= 5 ? 'score-mid' : 'score-low';
            domeinenHTML += `
                <div style="margin-bottom: 1rem; background: var(--bg-element); padding: 0.75rem; border-radius: 6px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <strong>${translateTag(domein.domein_type)}</strong>
                        <span class="score-badge ${scoreClass}" style="font-size: 0.75rem; padding: 0.15rem 0.5rem;">${score}/10</span>
                    </div>
                    <p style="font-size: 0.85rem; font-style: italic; margin: 0.5rem 0;">${formatText(domein.conceptuele_metafoor || '')}</p>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin: 0;">Kernfrasen: ${(domein.kernfrasen || []).join(', ')}</p>
                </div>
            `;
        });

        domeinenCard.innerHTML = `
            <div class="card-header">
                <span class="card-title">Dominante metaforische domeinen</span>
            </div>
            <div class="text-content">
                ${domeinenHTML}
            </div>
        `;
        container.appendChild(domeinenCard);

        // Coherentie Analyse (uitgebreid)
        const coherentieData = data.diagnostische_evaluatie?.coherentie_analyse || {};
        const incoherentiePunten = coherentieData.incoherentie_punten || [];
        const succesvolleBlending = coherentieData.succesvolle_blending || [];

        if (incoherentiePunten.length > 0 || succesvolleBlending.length > 0) {
            const coherentieCard = document.createElement('div');
            coherentieCard.className = 'card';

            let coherentieHTML = '';

            if (succesvolleBlending.length > 0) {
                coherentieHTML += '<div style="margin-bottom: 1rem;"><strong>Succesvolle blending:</strong>';
                succesvolleBlending.forEach(b => {
                    coherentieHTML += `
                        <div style="margin-top: 0.5rem; padding: 0.5rem; background: var(--bg-element); border-radius: 4px; font-size: 0.85rem;">
                            <p style="margin: 0;"><strong>Locatie:</strong> ${formatText(b.locatie || '')}</p>
                            ${b.gemengde_metaforen?.length ? `<p style="margin: 0.25rem 0; font-size: 0.8rem; color: var(--text-muted);">Metaforen: ${b.gemengde_metaforen.map(m => formatText(m)).join(', ')}</p>` : ''}
                            ${b.blending_strategie ? `<p style="margin: 0.25rem 0; font-size: 0.8rem;">${formatText(b.blending_strategie)}</p>` : ''}
                        </div>`;
                });
                coherentieHTML += '</div>';
            }

            if (incoherentiePunten.length > 0) {
                coherentieHTML += '<div style="margin-top: 1rem;"><strong style="color: var(--warning-color);">Incoherentiepunten:</strong>';
                incoherentiePunten.forEach(p => {
                    // Handle both string and object formats
                    if (typeof p === 'string') {
                        coherentieHTML += `<p style="margin: 0.5rem 0; font-size: 0.85rem; padding-left: 0.5rem; border-left: 2px solid var(--warning-color);">${formatText(p)}</p>`;
                    } else {
                        const ernstColor = (p.ernst === 'ERNSTIG' || p.ernst === 'HOOG') ? 'var(--danger-color)' : p.ernst === 'MATIG' ? 'var(--warning-color)' : 'var(--success-color)';
                        coherentieHTML += `
                            <div style="margin-top: 0.5rem; padding: 0.5rem; background: var(--bg-element); border-radius: 4px; border-left: 3px solid ${ernstColor}; font-size: 0.85rem;">
                                <p style="margin: 0;"><strong>Locatie:</strong> ${formatText(p.locatie || '')}</p>
                                ${p.metafoor_a && p.metafoor_b ? `<p style="margin: 0.25rem 0; font-size: 0.8rem;"><strong>Conflict:</strong> ${formatText(p.metafoor_a)} vs. ${formatText(p.metafoor_b)}</p>` : ''}
                                ${p.conflict_beschrijving ? `<p style="margin: 0.25rem 0; font-size: 0.8rem;">${formatText(p.conflict_beschrijving)}</p>` : ''}
                                ${p.entailment_conflict ? `<p style="margin: 0.25rem 0; font-size: 0.8rem; color: var(--text-muted);"><strong>Entailment conflict:</strong> ${formatText(p.entailment_conflict)}</p>` : ''}
                                ${p.ernst ? `<p style="margin: 0.25rem 0 0 0; font-size: 0.75rem; color: ${ernstColor};">[${translateTag(p.ernst)}]</p>` : ''}
                            </div>`;
                    }
                });
                coherentieHTML += '</div>';
            }

            coherentieCard.innerHTML = `
                <div class="card-header">
                    <span class="card-title">Coherentie analyse</span>
                </div>
                <div class="text-content">
                    ${coherentieHTML}
                </div>
            `;
            container.appendChild(coherentieCard);
        }

        // Metafoor Inventaris
        const metafoorCard = document.createElement('div');
        metafoorCard.className = 'card';
        const metaforen = data.primaire_analyse?.metafoor_inventaris || [];

        let metafoorHTML = '';
        metaforen.forEach((meta, idx) => {
            const vitaliteit = meta.vitaliteit_status || 'ONBEKEND';
            const vitaliteitColor = vitaliteit === 'LEVEND' ? 'var(--success-color)' : vitaliteit === 'DOOD' ? 'var(--danger-color)' : 'var(--warning-color)';

            // Mapping structuur
            let mappingHTML = '';
            if (meta.mapping_structuur && meta.mapping_structuur.length > 0) {
                mappingHTML = '<p style="margin: 0.25rem 0; font-size: 0.8rem; color: var(--text-muted);">';
                mappingHTML += meta.mapping_structuur.map(m => `${formatText(m.bron_element)} \u2192 ${formatText(m.doel_element)}`).join('; ');
                mappingHTML += '</p>';
            }

            // Entailments (compact)
            let entailmentsHTML = '';
            if (meta.entailments) {
                const ent = meta.entailments;
                let allImplicaties = [];
                if (ent.theologische_implicaties?.length) allImplicaties.push(...ent.theologische_implicaties);
                if (ent.cognitieve_implicaties?.length) allImplicaties.push(...ent.cognitieve_implicaties);
                if (ent.onbedoelde_consequenties?.length) allImplicaties.push(...ent.onbedoelde_consequenties.filter(c => c !== 'Geen'));

                if (allImplicaties.length > 0) {
                    entailmentsHTML = `<p style="margin: 0.25rem 0; font-size: 0.8rem; color: var(--text-muted);"><strong>Implicaties:</strong> ${allImplicaties.slice(0, 2).map(i => formatText(i)).join('; ')}</p>`;
                }
            }

            metafoorHTML += `
                <div style="margin-bottom: 1rem; padding-bottom: 0.75rem; ${idx < metaforen.length - 1 ? 'border-bottom: 1px solid var(--border-color);' : ''}">
                    <p style="font-weight: bold; margin-bottom: 0.25rem; font-size: 0.9rem;">\u201c${formatText(meta.metafoor_expressie)}\u201d</p>
                    <p style="margin: 0.25rem 0; font-size: 0.85rem;"><strong>Bron:</strong> ${formatText(meta.brondomein?.naam || 'Onbekend')} \u2192 <strong>Doel:</strong> ${formatText(meta.doeldomein?.theologisch_concept || 'Onbekend')}</p>
                    ${mappingHTML}
                    ${entailmentsHTML}
                    <p style="margin: 0.25rem 0; font-size: 0.8rem; color: ${vitaliteitColor};"><strong>Vitaliteit:</strong> ${translateTag(vitaliteit)} \u2014 <span style="font-style: italic; color: var(--text-muted);">${formatText(meta.vitaliteit_toelichting || '')}</span></p>
                </div>
            `;
        });

        metafoorCard.innerHTML = `
            <div class="card-header">
                <span class="card-title">Metafoor inventaris</span>
            </div>
            <div class="text-content">
                ${metafoorHTML}
            </div>
        `;
        container.appendChild(metafoorCard);

        // Sterktes en Risico's
        const evalCard = document.createElement('div');
        evalCard.className = 'card';
        const sterktes = data.diagnostische_evaluatie?.sterktes || [];
        const risicos = data.diagnostische_evaluatie?.risicos || [];

        let sterktesHTML = '';
        sterktes.forEach(s => {
            sterktesHTML += `
                <div style="margin-bottom: 0.75rem; padding: 0.5rem; background: var(--bg-element); border-radius: 4px; border-left: 3px solid var(--success-color);">
                    <p style="margin: 0;"><strong>${translateTag(s.sterkte_type)}:</strong> ${formatText(s.beschrijving)}</p>
                    ${s.voorbeeld ? `<p style="margin: 0.25rem 0 0 0; font-size: 0.8rem; font-style: italic; color: var(--text-muted);">\u201c${formatText(s.voorbeeld)}\u201d</p>` : ''}
                </div>`;
        });

        let risicosHTML = '';
        risicos.forEach(r => {
            const ernstColor = (r.ernst === 'ERNSTIG' || r.ernst === 'HOOG') ? 'var(--danger-color)' : r.ernst === 'MATIG' ? 'var(--warning-color)' : 'var(--success-color)';
            risicosHTML += `
                <div style="margin-bottom: 0.75rem; padding: 0.5rem; background: var(--bg-element); border-radius: 4px; border-left: 3px solid ${ernstColor};">
                    <p style="margin: 0;"><strong>${translateTag(r.risico_type)}</strong> <span style="color: ${ernstColor};">(${translateTag(r.ernst)})</span>: ${formatText(r.beschrijving)}</p>

                            ${c.resolutie_strategie ? `<p style="margin: 0.25rem 0 0 0; font-size: 0.8rem;"><strong>Oplossing:</strong> ${formatText(c.resolutie_strategie)}</p>` : ''}

                aanbevHTML += '</div>';

            // Entailment checks
            if (aanbev.entailment_checks?.length > 0) {

            // Alternatieve domeinen
            if (aanbev.alternatieve_domeinen?.length > 0) {

                        <div style="margin-top: 0.5rem; padding: 0.5rem; background: var(--bg-element); border-radius: 4px; font-size: 0.85rem;">
                            ${a.voorgesteld_domein ? `<p style="margin: 0;"><strong>${formatText(a.voorgesteld_domein)}</strong></p>` : ''}
                            ${a.rationale ? `<p style="margin: 0.25rem 0; font-size: 0.8rem;">${formatText(a.rationale)}</p>` : ''}
                            ${a.doel_concept ? `<p style="margin: 0.25rem 0 0 0; font-size: 0.8rem; color: var(--text-muted);">Doel: ${formatText(a.doel_concept)}</p>` : ''}

                aanbevHTML += '</div>';
            }

            // Slotopmerking
            if (aanbev.slotopmerking) {
                aanbevHTML += `
                    <div style="padding: 0.75rem; background: var(--bg-element); border-radius: 4px; border-left: 3px solid var(--primary-color); font-size: 0.9rem;">

                    </div>`;
            }

            aanbevCard.innerHTML = `
                <div class="card-header">
                    <span class="card-title">Aanbevelingen</span>
                    <span class="score-badge ${aanbev.overall_beoordeling === 'EXCELLENT' ? 'score-high' : 'score-mid'}">${translateTag(aanbev.overall_beoordeling || 'Onbekend')}</span>
                </div>
                <div class="text-content">
                    ${aanbevHTML}
                </div>
            `;
            container.appendChild(aanbevCard);
        }

        // Comparatieve Analyse
        const compAnalMetafoor = data.comparatieve_analyse || {};
        if (compAnalMetafoor.verschil_met_esthetiek || compAnalMetafoor.verschil_met_kolb || compAnalMetafoor.unieke_inzichten_CMT) {
            const compAnalMetafoorCard = document.createElement('div');
            compAnalMetafoorCard.className = 'card';

            let compAnalMetafoorHTML = '';
            if (compAnalMetafoor.verschil_met_esthetiek) {
                compAnalMetafoorHTML += `<p style="margin-bottom: 0.75rem; font-size: 0.85rem;"><strong>vs. Esthetiek:</strong> ${formatText(compAnalMetafoor.verschil_met_esthetiek)}</p>`;

                compAnalMetafoorHTML += `<p style="margin-bottom: 0.75rem; font-size: 0.85rem;"><strong>vs. Kolb:</strong> ${formatText(compAnalMetafoor.verschil_met_kolb)}</p>`;

            if (compAnalMetafoor.unieke_inzichten_CMT) {
                compAnalMetafoorHTML += `<p style="margin-bottom: 0; font-size: 0.85rem;"><strong>Unieke inzichten CMT:</strong> ${formatText(compAnalMetafoor.unieke_inzichten_CMT)}</p>`;

                <div class="card-header">

                </div>
                <div class="text-content">
                    ${compAnalMetafoorHTML}
                </div>

            container.appendChild(compAnalMetafoorCard);
        }

        // Appendices
        const app = data.appendices;
        if (app) {
            const appCard = document.createElement('div');
            appCard.className = 'card';

            let appHTML = '';

            if (app.volledige_metafoor_lijst?.length > 0) {
                appHTML += `<p style="margin-bottom: 0.5rem;"><strong>Metaforen:</strong> ${app.volledige_metafoor_lijst.map(m => formatText(m)).join('; ')}</p>`;
            }

            if (app.woord_frequentie_analyse) {
                const freq = app.woord_frequentie_analyse;
                const freqItems = Object.entries(freq).map(([k, v]) => {
                    if (typeof v === 'object' && v.count) {
                        return `${k}: ${v.count}${v.primair_subject ? ` (${v.primair_subject})` : ''}`;
                    }
                    return `${k}: ${v}`;
                });
                if (freqItems.length > 0) {
                    appHTML += `<p style="margin-bottom: 0.5rem;"><strong>Woordfrequentie:</strong> ${freqItems.join('; ')}</p>`;
                }
            }

            if (app.notities) {
                appHTML += `<p style="margin: 0; font-style: italic; color: var(--text-muted);">${formatText(app.notities)}</p>`;
            }

            appCard.innerHTML = `
                <div class="card-header">
                    <span class="card-title">Appendices</span>
                </div>
                <div class="text-content">
                    ${appHTML}
                </div>
            `;
            container.appendChild(appCard);
        }
    }

    function renderAnalysisNarratief(data) {

        let aanbeveHTML = `
            <p><strong>Actantiële audit:</strong> ${formatText(aanbev.actantiele_audit_samenvatting || '')}</p>
        `;

        // Subject herpositionering
        if (aanbev.subject_herpositionering?.nodig === 'true' || aanbev.subject_herpositionering?.nodig === true) {
            aanbeveHTML += `
                <div style="background: var(--bg-element); padding: 0.75rem; border-radius: 6px; margin-top: 0.75rem; border-left: 3px solid var(--warning-color); font-size: 0.9rem;">

            `;

        // Identificatie herstel
        if (aanbev.identificatie_herstel?.nodig === 'true' || aanbev.identificatie_herstel?.nodig === true) {

        // Modale balans
        if (aanbev.modale_balans) {

                    <strong>Modale balans</strong>
                    ${aanbev.modale_balans.huidige_onbalans ? `<p style="margin: 0.25rem 0; font-size: 0.85rem;">${formatText(aanbev.modale_balans.huidige_onbalans)}</p>` : ''}
                    ${aanbev.modale_balans.voorgestelde_balans ? `<p style="margin: 0.25rem 0; font-size: 0.85rem;">${formatText(aanbev.modale_balans.voorgestelde_balans)}</p>` : ''}
                    ${aanbev.modale_balans.concrete_suggestie ? `<p style="font-style: italic; margin: 0.25rem 0; font-size: 0.8rem; color: var(--text-muted);">${formatText(aanbev.modale_balans.concrete_suggestie)}</p>` : ''}
